<!DOCTYPE html>
<html lang="en" xml:lang="en">

<head>
    <meta charset="utf-8">
    <title>Root CAs</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #fff;
            --fg: #1b1b1b;
            --muted: #666;
            --border: #ccc;
            --warn-bg: #fdecea;
            --warn-border: #d93025;
            --caution-bg: #fff4e5;
            --caution-border: #e8a33d;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #2b2a33;
                --fg: #fbfbfe;
                --muted: #aaa;
                --border: #555;
                --warn-bg: #4a1f1c;
                --warn-border: #f28b82;
                --caution-bg: #4a3816;
                --caution-border: #fdd663;
            }
        }

        body {
            font-family: sans-serif;
            font-size: 13px;
            padding: 10px;
            width: 520px;
            /* Firefox caps popups at 600px tall; popup.js lowers this to 90%
               of the window height on smaller windows. */
            max-height: 600px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            margin: 0;
            background: var(--bg);
            color: var(--fg);
        }

        h3 {
            margin: 0 0 4px;
        }

        h4 {
            margin: 12px 0 4px;
        }

        #permission-banner {
            background: var(--warn-bg);
            border-left: 3px solid var(--warn-border);
            padding: 6px;
            margin-bottom: 8px;
        }

        #summary {
            color: var(--muted);
            margin-bottom: 8px;
            white-space: pre-line;
        }

        #list-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            color: var(--muted);
            font-size: 11px;
            margin-bottom: 8px;
        }

        #list-status.stale #list-age {
            color: var(--caution-border);
            font-weight: bold;
        }

        #content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        li {
            padding: 5px 6px;
            border-bottom: 1px solid var(--border);
        }

        .warn li {
            background: var(--warn-bg);
            border-left: 3px solid var(--warn-border);
        }

        .caution li {
            background: var(--caution-bg);
            border-left: 3px solid var(--caution-border);
        }

        .name {
            font-weight: bold;
        }

        .meta {
            color: var(--muted);
            font-size: 11px;
            overflow-wrap: anywhere;
        }

        .fp {
            font-family: monospace;
        }

        .root {
            cursor: pointer;
        }

        .details {
            margin-top: 4px;
            cursor: auto;
        }

        .details .meta {
            margin-bottom: 2px;
        }

        .details button {
            margin-top: 4px;
        }

        .label {
            font-weight: bold;
        }

        .never-seen {
            margin-top: 12px;
        }

        .stats {
            margin-bottom: 8px;
        }

        .stats-heading {
            margin-top: 6px;
        }

        .stats summary,
        .never-seen summary {
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 4px;
        }

        .org {
            font-weight: bold;
            margin-top: 8px;
            padding: 0 6px;
        }

        .note {
            color: var(--muted);
            font-size: 11px;
            margin: 0 0 4px;
        }

        .button-row {
            display: flex;
            gap: 5px;
        }
    </style>
</head>

<body>
    <h3>Seen Root CAs</h3>
    <div id="permission-banner" hidden>
        Access to all websites is turned off, so no connections are recorded.
        <button id="grant-access">Allow access</button>
    </div>
    <div id="summary">Loading...</div>
    <div id="list-status">
        <span id="list-age"></span>
        <div class="button-row">
            <button id="update-list">Update list</button>
            <button id="reset">Reset seen</button>
            <button id="copy">Copy</button>
        </div>
    </div>
    <div id="content"></div>

    <script src="popup.js"></script>
</body>

</html>
